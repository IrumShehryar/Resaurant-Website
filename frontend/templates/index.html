{% extends "base.html" %}
{% block title %}{{ t.home_title }}{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
{% endblock %}
{% block content %}

<section class="hero">
    <div class="hero-content">
        <div class="hero-left">
            <p class="hero-tagline">{{ t.hero_tagline }}</p>

            <h1 class="hero-title">{{ t.hero_main_title }}</h1>

            <p class="hero-description">
                {{ t.hero_description }}
            </p>

            <div class="hero-features">
                <span>🌌 {{ t.hero_feature_1 }}</span>
                <span>❄️ {{ t.hero_feature_2 }}</span>
                <span>🔥 {{ t.hero_feature_3 }}</span>
            </div>
        </div>

        <div class="hero-right">
            <img 
                class="hero-image"
                src="{{ url_for('static', filename='assets/hero1.jpg') }}"
                alt="{{ t.hero_image_alt }}"
            />
        </div>
    </div>

    <div class="hero-fade" aria-hidden="true"></div>
</section>

{% endblock %}
