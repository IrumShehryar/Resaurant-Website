{% extends "base.html" %} {% block title %}Admin Users Management{% endblock %}
{% block styles %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/admin-interface.css') }}"
/>
{% endblock %} {% block content %}
<div class="panel-layout">
    {% include "admin_sidebar.html" %}
    <main class="admin-section">
        <div class="dashboard-group">
            <h4 class="group-title">User Stats</h4>
            <div class="dashboard-stats">
                <div class="dashboard-stat">
                    <span class="stat-label">Total Users</span
                    ><span class="stat-value" id="users-total">0</span>
                </div>
                <div class="dashboard-stat">
                    <span class="stat-label">Admins</span
                    ><span class="stat-value" id="users-admins">0</span>
                </div>
                <div class="dashboard-stat">
                    <span class="stat-label">Customers</span
                    ><span class="stat-value" id="users-customers">0</span>
                </div>
                <div class="dashboard-stat">
                    <span class="stat-label">Blocked</span
                    ><span class="stat-value" id="users-blocked">0</span>
                </div>
            </div>
        </div>
        <div style="height: 2rem"></div>
        <h1>Users Management</h1>
        <!-- Add your users management table and controls here -->
    </main>
</div>
{% endblock %} {% block scripts %}
<script
    type="module"
    src="{{ url_for('static', filename='js/admin/usersAdmin.js') }}"
></script>
{% endblock %}
