{% extends "base.html" %}

{% block title %}Revontulet Flamehouse — {{ t.login }}{% endblock %}

{% block styles %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/customer-login.css') }}"
/>
{% endblock %}

{% block content %}

<section class="hero">
    <div class="hero-content">
        <div class="hero-left">
            <!-- Login / Sign-up Form -->
            <div class="login-box" id="auth-box">
                <h2>{{ t.login }}</h2>

                <input type="hidden" id="next-url" value="{{ next_url }}" />

                <form id="auth-form">
                    <label>{{ t.email }}:
                        <input type="email" name="email" required />
                    </label>

                    <label>{{ t.password }}:
                        <input type="password" name="password" required />
                    </label>

                    <button type="submit">{{ t.login }}</button>
                </form>

                <p id="toggle-text">
                    {{ t.no_account }}
                    <a href="#" id="toggle-link">{{ t.sign_up_here }}</a>
                </p>
            </div>
        </div>

        <div class="hero-right">
            <img
                class="hero-image"
                src="{{ url_for('static', filename='assets/hero1.jpg') }}"
                alt="{{ t.burgers_and_drinks }}"
            />
        </div>
    </div>

    <div class="hero-fade"></div>
</section>

{% endblock %}

{% block scripts %}
<script
    type="module"
    src="{{ url_for('static', filename='js/customer-login.js') }}"
></script>
{% endblock %}
